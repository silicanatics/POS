<button mdbBtn type="button" gradient="peach" mdbWavesEffect (click)="bashbtnclick('purch')">Menu Items</button>
<button mdbBtn type="button" gradient="purple" mdbWavesEffect (click)="bashbtnclick('menu')">Menu Manager</button>
<button mdbBtn type="button" gradient="blue" mdbWavesEffect (click)="bashbtnclick('users')">User Manager</button>
<button mdbBtn type="button" gradient="night-fade" mdbWavesEffect (click)="bashbtnclick('stockcapture')">Stock
  Capture</button>
<button mdbBtn type="button" gradient="morpheus-den" mdbWavesEffect (click)="bashbtnclick('reports')">Reports</button>
<button mdbBtn type="button" gradient="aqua" mdbWavesEffect (click)="bashbtnclick('logout')">Logout</button>
<div style="padding-left: 30px;" *ngIf="application.daysToExpirery < 10">
  <strong style="color: red;">Application about to expire in {{application.daysToExpirery}} days. Please renew </strong>
</div>
<div class="col-md-3">
  <mat-form-field class="example-full-width" appearance="fill" style="padding: 10px;">
    <mat-label>Choose a date</mat-label>
    <input matInput [matDatepicker]="picker" (dateInput)="OnDateChange($event.value)" formControlName="date">
    <mat-datepicker-toggle matSuffix [for]="picker">
      <mat-icon matDatepickerToggleIcon> keyboard_arrow_down </mat-icon>
    </mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
</div>
