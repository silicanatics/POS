<div [formGroup]="menuSearchForm">
    <input type="text" formControlName="search" placeholder="menu item search.....">
    <a mdbBtn size="sm" gradient="purple" mdbWavesEffect (click)="searchItem()">
        <mdb-icon fas icon="search"></mdb-icon>
    </a>

    <button mdbBtn size="md" gradient="blue" mdbWavesEffect (click)="addNewMenu()">Add New Menu</button>
    <button mdbBtn size="md" gradient="blue" mdbWavesEffect (click)="SearchItemByBarCode()">SearchByBarCode</button>
</div>

<div class="row">
    <div class="col-lg-6 ">
        <div class="card">
            <div class="card-header">
                <h3>add menu Items</h3>
            </div>
            <div class="card-body">
                <div style="overflow: scroll;height: 70vh;">
                    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">
                        <!-- This is the tree node template for leaf nodes -->
                        <!-- There is inline padding applied to this node using styles.
                       This padding value depends on the mat-icon-button width. -->
                        <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
                            <div class="hover" (click)="getMenuItems(node)" [class.nodecolor]="node.id==nodeId">
                                {{node.caption}}
                            </div>
                        </mat-tree-node>
                        <!-- This is the tree node template for expandable nodes -->
                        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                            <div class="mat-tree-node">
                                <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.caption">
                                    <mat-icon class="mat-icon-rtl-mirror">
                                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                                    </mat-icon>
                                </button>
                                <div class="hover" (click)="getMenuItems(node)" [class.nodecolor]="node.id==nodeId">
                                    {{node.caption}}
                                </div>
                            </div>
                            <!-- There is inline padding applied to this div using styles.
                          This padding value depends on the mat-icon-button width.  -->
                            <div [class.example-tree-invisible]="!treeControl.isExpanded(node)" role="group">
                                <ng-container matTreeNodeOutlet></ng-container>
                            </div>
                        </mat-nested-tree-node>
                    </mat-tree>
                </div>
            </div>
        </div>
    </div>


    <div class="col-lg-6">
        <div class="form-group" [formGroup]="menuItemForm">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <h3>{{nodeDescription}}</h3>
                        </div>

                        <div class="card-body">

                            <div class="col-md-12">

                                <div class="row">
                                    <div class="col-lg-4">
                                        <label>Caption</label>
                                    </div>
                                    <div class="col-lg-8">
                                        <input id="txtname" type="text" formControlName="caption" class="form-control"
                                            [ngClass]="{ 'is-invalid': submitted && f.caption.errors }" />
                                        <div *ngIf="submitted && f.caption.errors" class="invalid-feedback">
                                            <div *ngIf="f.caption.errors.required">Cption is required</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12" *ngIf="!has_Children">

                                <div class="row">
                                    <div class="col-lg-4">
                                        <label>Price</label>
                                    </div>
                                    <div class="col-lg-8">
                                        <input id="price" type="text" formControlName="price" class="form-control"
                                            [ngClass]="{ 'is-invalid': submitted && f.caption.errors }" />
                                        <div *ngIf="submitted && f.price.errors" class="invalid-feedback">
                                            <div *ngIf="f.price.errors.required">price is required</div>
                                        </div>
                                    </div>
                                </div>



                            </div>
                            <div class="col-md-12" *ngIf="!has_Children">


                                <div class="row">
                                    <div class="col-lg-4">
                                        <label>Bar-Code</label>
                                    </div>
                                    <div class="col-lg-8">
                                        <input id="BarCode" type="text" formControlName="barcode" class="form-control"
                                            [ngClass]="{ 'is-invalid': submitted && f.barcode.errors }" />
                                        <div *ngIf="submitted && f.barcode.errors" class="invalid-feedback">
                                            <div *ngIf="f.barcode.errors.required">barcode is required</div>
                                        </div>
                                    </div>
                                </div>




                            </div>
                            <div class="col-md-12">


                                <div class="row">
                                    <div class="col-lg-4">
                                        <label>Item-Type</label>
                                    </div>
                                    <div class="col-lg-8">
                                        <select class="custom-select" (change)="changeItemType($event)"
                                            formControlName="menuItemType">
                                            <!-- <option value="" disabled>Choose Item Type</option> -->
                                            <option *ngFor="let mit of menuItemTypeList " [ngValue]="mit"
                                                [selected]="mit.id==mitId">{{mit.description}}</option>
                                        </select>
                                    </div>
                                </div>


                            </div>

                            <div class="card-footer">

                                <button style="padding: 10px; width: 80px;" mdbBtn type="button" color="default" mdbWavesEffect
                                    (click)="addStockItem()">Add</button>                    



                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>
<!-- </div> -->
