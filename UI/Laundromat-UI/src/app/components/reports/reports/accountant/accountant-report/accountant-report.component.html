    <div class="card-body">
      <div class="row">
        <div class="col-sm-8" style="height: 90vh;overflow-y: scroll;">
          <table mat-table [dataSource]="dataSource" class="report-table">
            <!-- Position Column -->
  
  
            <ng-container matColumnDef="ParentCaption">
              <th mat-header-cell *matHeaderCellDef> ParentCaption </th>
              <td mat-cell *matCellDef="let element"> {{element.ParentCaption}} </td>
            </ng-container>
  
            <ng-container matColumnDef="Caption">
              <th mat-header-cell *matHeaderCellDef> Caption </th>
              <td mat-cell *matCellDef="let element"> {{element.Caption}} </td>
            </ng-container>
            
  
            <!-- Name Column -->
            <ng-container matColumnDef="Sales">
              <th mat-header-cell *matHeaderCellDef> Sales </th>
              <td mat-cell *matCellDef="let element"> {{element.Sales}} </td>
            </ng-container>
  
            <!-- Weight Column -->
            <ng-container matColumnDef="TotalPrice">
              <th mat-header-cell *matHeaderCellDef> TotalPrice </th>
              <td mat-cell *matCellDef="let element"> R{{element.TotalPrice|number: '2.2-2'}} </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true""></tr> -->
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
        <div class="col-sm-4">
          <h1>Totals</h1>
          <h1>Price : R{{totalPrice|number: '2.2-2'}}</h1>
          <h1>Sales : {{totalSales}}</h1>
          <div style="display: block">
            <canvas mdbChart [chartType]="chartType" [datasets]="chartDatasets" [labels]="chartLabels"
              [colors]="barChartColors" [options]="chartOptions" [legend]="true" (chartHover)="chartHovered($event)"
              (chartClick)="chartClicked($event)">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
